<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>365 يومًا لك — تجربة</title>
<style>
:root {
  --black:#030303;
  --soft:#0b0b0d;
  --white:#faf8f5;
  --muted:#aaa39a;
  --gold:#d4b276;
  --paper:#f1eadf;
  --ink:#1b1714;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  min-height:100vh;
  background:var(--black);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}
button { font:inherit; }
.hidden { display:none !important; }
.screen {
  min-height:100svh;
  width:100%;
  position:relative;
}
.grain {
  position:fixed; inset:0; z-index:999; pointer-events:none; opacity:.13;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
  mix-blend-mode:screen;
}
.music-toggle {
  position:fixed; top:max(16px,env(safe-area-inset-top)); left:16px; z-index:1000;
  width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.42); color:white; backdrop-filter:blur(12px);
}
.music-toggle.on { color:var(--gold); box-shadow:0 0 24px rgba(212,178,118,.22); }

/* INTRO */
.intro {
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 44%,rgba(55,39,24,.55),transparent 31%),
    linear-gradient(180deg,#000 0%,#080808 68%,#000 100%);
}
.sparkles::before,.sparkles::after {
  content:""; position:absolute; inset:-25%;
  background-image:radial-gradient(circle,rgba(255,255,255,.72) 0 1px,transparent 1.4px);
  background-size:76px 76px; opacity:.17; animation:stars 20s linear infinite;
}
.sparkles::after { background-size:122px 122px; opacity:.09; animation-duration:32s; }
@keyframes stars { to { transform:translate(90px,-110px); } }

.balloon-scene {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; animation:sceneIn 1.25s .3s forwards, sceneOut 1s 5s forwards;
}
.balloon-wrap {
  position:relative; width:min(78vw,430px); height:min(96vw,520px);
  display:flex; align-items:flex-start; justify-content:center;
  animation:float 4s ease-in-out infinite;
}
.balloon {
  position:relative;
  width:min(70vw,380px); height:min(82vw,440px);
  border-radius:50% 50% 47% 47% / 56% 56% 44% 44%;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 31% 23%,rgba(255,255,255,.44),transparent 12%),
    radial-gradient(circle at 45% 38%,#e7c58c 0%,#b88a4d 48%,#6d4523 100%);
  box-shadow:
    inset -28px -34px 55px rgba(57,28,9,.48),
    inset 18px 12px 40px rgba(255,255,255,.18),
    0 36px 100px rgba(0,0,0,.72),
    0 0 65px rgba(212,178,118,.24);
}
.balloon::after {
  content:""; position:absolute; bottom:-19px; left:50%; transform:translateX(-50%);
  width:0; height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:27px solid #86572d;
}
.string {
  position:absolute; top:calc(min(82vw,440px) - 1px); left:50%;
  width:1px; height:125px; background:rgba(255,255,255,.42);
  transform-origin:top; animation:stringSwing 3.8s ease-in-out infinite;
}
.balloon-text {
  font-size:clamp(2rem,8vw,3.6rem);
  font-weight:300;
  color:#fffdf8;
  text-shadow:0 3px 20px rgba(52,27,7,.45);
}
@keyframes float {
  0%,100% { transform:translateY(16px) rotate(-1.3deg); }
  50% { transform:translateY(-18px) rotate(1.3deg); }
}
@keyframes stringSwing {
  0%,100% { transform:translateX(-50%) rotate(3deg); }
  50% { transform:translateX(-50%) rotate(-3deg); }
}
@keyframes sceneIn { to { opacity:1; } }
@keyframes sceneOut { to { opacity:0; transform:scale(1.06); } }

.intro-copy {
  position:relative; z-index:5; width:min(88vw,700px);
  min-height:280px; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.intro-copy p {
  position:absolute; width:100%; margin:0;
  font-weight:300; line-height:2; opacity:0;
}
#line1 {
  font-size:clamp(1.35rem,5.2vw,2.25rem);
  animation:textIn 1.3s 6.2s forwards,textOut .8s 8.7s forwards;
}
#line2 {
  font-size:clamp(1.45rem,5.6vw,2.45rem);
  animation:textIn 1.3s 9.5s forwards;
}
.begin {
  position:absolute; top:200px;
  opacity:0; padding:13px 34px; border-radius:999px;
  border:1px solid rgba(255,255,255,.38);
  background:rgba(255,255,255,.04); color:white;
  animation:textIn 1.1s 11.7s forwards;
}
@keyframes textIn { to { opacity:1; transform:translateY(0); } }
@keyframes textOut { to { opacity:0; transform:translateY(-10px); } }

/* HOME */
.home {
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:30px;
  background:
    radial-gradient(circle at 50% 30%,rgba(212,178,118,.10),transparent 30%),
    linear-gradient(180deg,#050505,#0a0a0c);
}
.home-box { width:min(100%,570px); }
.kicker { color:var(--gold); letter-spacing:.13em; font-size:.88rem; margin-bottom:18px; }
.home h1 { font-size:clamp(1.9rem,7vw,3rem); font-weight:300; margin:0; }
.track { height:2px; background:rgba(255,255,255,.13); margin:30px 0 24px; overflow:hidden; }
.fill { height:100%; background:linear-gradient(90deg,#8e6f3d,var(--gold),#f0ddb5); width:0; transition:width .7s ease; }
.status { color:var(--muted); min-height:48px; line-height:1.9; }
.open-btn { border:0; border-bottom:1px solid rgba(255,255,255,.42); background:none; color:white; padding:10px 4px; }
.completed { margin-top:26px; }
.completed .heart { font-size:1.55rem; }

/* LETTER */
.letter {
  padding:22px 10px 54px;
  background:
    radial-gradient(circle at 50% -18%,rgba(212,178,118,.13),transparent 40%),
    #080808;
}
.stage { width:min(100%,830px); margin:auto; }
.letter-header { padding:0 8px 18px; }
.letter-header small { color:var(--gold); letter-spacing:.11em; }
.letter-header h2 { font-size:clamp(1.25rem,5vw,1.9rem); font-weight:300; margin:7px 0 0; }
.page {
  position:relative; color:var(--ink);
  background:
    linear-gradient(90deg,rgba(0,0,0,.045),transparent 8%,transparent 92%,rgba(0,0,0,.05)),
    repeating-linear-gradient(0deg,rgba(67,52,38,.019) 0 1px,transparent 1px 4px),
    var(--paper);
  border-radius:4px 17px 17px 4px;
  box-shadow:0 32px 95px rgba(0,0,0,.58),inset 24px 0 32px rgba(93,70,46,.06);
  animation:pageOpen 1.05s cubic-bezier(.2,.8,.2,1) both;
}
.page::after {
  content:""; position:absolute; left:0; right:0; bottom:-7px; height:7px;
  background:linear-gradient(180deg,#c9bfb1,#978b7d); opacity:.78;
}
@keyframes pageOpen {
  from { opacity:0; transform:perspective(1250px) rotateY(-15deg) translateY(20px); }
  to { opacity:1; transform:perspective(1250px) rotateY(0) translateY(0); }
}
.content { padding:clamp(30px,7vw,72px) clamp(22px,8vw,80px) clamp(36px,7vw,64px); }
.date { color:#7d7165; font-size:.86rem; }
.content h3 { font-size:clamp(1.7rem,5.8vw,2.55rem); margin:16px 0 28px; }
.body { white-space:pre-line; font-size:clamp(1.05rem,4vw,1.2rem); line-height:2.3; }
.done-wrap { display:flex; justify-content:center; padding-top:52px; }
.done {
  display:flex; align-items:center; gap:8px;
  border:0; background:none; color:#2d2722; opacity:.78;
}
.done b { font-size:1.55rem; }

/* GOODBYE & LOCKED */
.goodbye,.locked { display:flex; align-items:center; justify-content:center; text-align:center; padding:28px; }
.goodbye p { font-size:clamp(1.55rem,7vw,2.9rem); opacity:0; animation:textIn 1.2s forwards; }
.locked p { color:var(--muted); }
</style>
</head>

const $=id=>document.getElementById(id);
const screens=["intro","home","letter","goodbye","locked"];

const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[Number(d)]);
const show=id=>{screens.forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo({top:0,behavior:"smooth"})};
const unlocked=()=>1;
const progress=d=>Math.max(0,Math.min(100,d/TOTAL*100));
const key=d=>`day-complete-${d}`;
const isDone=d=>localStorage.getItem(key(d))==="yes";

function showHome(){
  const d=unlocked();
  if(!d){show("locked");return;}
  $("homeTitle").textContent=`اليوم ${ar(d)} من ${ar(TOTAL)}`;
  $("homeFill").style.width=progress(d)+"%";
  $("openBtn").classList.toggle("hidden",isDone(d));
  $("completed").classList.toggle("hidden",!isDone(d));
  $("status").textContent=isDone(d)?"رسالة اليوم أخذت وقتها.":"هناك رسالة واحدة فقط تنتظرك اليوم.";
  show("home");
}

function openToday(){
  const d=unlocked();
  if(!d)return;
  const m=messages[d-1];
  $("counter").textContent=`اليوم ${ar(d)} من ${ar(TOTAL)}`;
  $("letterFill").style.width=progress(d)+"%";
  const date=new Date(START_DATE);
  date.setDate(date.getDate()+d-1);
  $("date").textContent=new Intl.DateTimeFormat("ar-SA",{day:"numeric",month:"long",year:"numeric"}).format(date);
  $("title").textContent=m.title;
  $("body").textContent=m.body;
  $("heart").textContent=isDone(d)?"♥":"♡";
  show("letter");
}

$("begin").onclick=showHome;
$("openBtn").onclick=openToday;
$("done").onclick=()=>{
  const d=unlocked();
  $("heart").textContent="♥";
  localStorage.setItem(key(d),"yes");
  setTimeout(()=>{
    show("goodbye");
    setTimeout(showHome,2400);
  },450);
};

/* Built-in soft piano using Web Audio */
let ctx=null,playing=false,timer=null,step=0;
const sequence=[
  [261.63,329.63,392.00],
  [220.00,261.63,329.63],
  [174.61,220.00,261.63],
  [196.00,246.94,293.66]
];
function pianoNote(freq,start,duration,vol=.035){
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.0001,start);
  gain.gain.exponentialRampToValueAtTime(vol,start+.05);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start);osc.stop(start+duration+.05);
}
function playChord(){
  if(!playing||!ctx)return;
  const now=ctx.currentTime;
  const chord=sequence[step%sequence.length];
  chord.forEach((f,i)=>pianoNote(f,now+i*.09,2.4,.025));
  pianoNote(chord[0]/2,now,2.8,.018);
  step++;
}
$("musicToggle").onclick=async()=>{
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended")await ctx.resume();
  playing=!playing;
  $("musicToggle").classList.toggle("on",playing);
  $("musicToggle").textContent=playing?"♫":"♪";
  if(playing){
    playChord();
    timer=setInterval(playChord,3000);
  }else{
    clearInterval(timer);
  }
};
